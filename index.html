<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARミニ水族館 - 3匹の魚が泳ぐ海底</title>

  <!-- 授業のキツネARと同じ A-Frame + AR.js を使用 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    .guide {
      position: fixed; z-index: 10; top: 12px; left: 50%;
      transform: translateX(-50%); width: max-content;
      max-width: calc(100% - 32px); padding: 10px 15px;
      border-radius: 24px; background: rgba(6, 39, 59, .74);
      color: white; font: 14px/1.4 system-ui, sans-serif;
      text-align: center; pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="guide">🐠 キツネのマーカーにカメラを向けてね</div>

  <a-scene embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <!-- 最初は配布資料の fox.patt を使用。後で自作 .patt に変更できる -->
    <a-marker type="pattern" url="fox.patt">

      <!-- 海底：平たい円柱と、その上の砂の層 -->
      <a-cylinder position="0 0.025 0" radius="0.52" height="0.05"
        color="#9C7750" segments-radial="40"></a-cylinder>
      <a-cylinder position="0 0.054 0" radius="0.50" height="0.015"
        color="#F6DCA4" segments-radial="40"></a-cylinder>

      <!-- 海底の小石（左手前） -->
      <a-sphere position="-0.34 0.088 0.22" scale="0.083 0.034 0.065"
        color="#8D9AA7"></a-sphere>
      <a-sphere position="-0.23 0.078 0.27" scale="0.055 0.024 0.045"
        color="#B0B9BF"></a-sphere>
      <a-sphere position="0.23 0.088 -0.25" scale="0.077 0.034 0.061"
        color="#9CA8AD"></a-sphere>

      <!-- 海藻：下側を軸にゆっくり揺れる -->
      <a-entity position="-0.29 0.061 -0.17"
        animation="property: rotation; from: 0 0 -10; to: 0 0 12; dir: alternate; dur: 1700; loop: true; easing: easeInOutSine">
        <a-cylinder position="0 0.12 0" radius="0.018" height="0.24"
          rotation="0 0 -12" color="#3EAA73"></a-cylinder>
        <a-cylinder position="-0.05 0.10 0" radius="0.014" height="0.19"
          rotation="0 0 -34" color="#65C28A"></a-cylinder>
        <a-cylinder position="0.044 0.105 0" radius="0.014" height="0.20"
          rotation="0 0 27" color="#249B73"></a-cylinder>
      </a-entity>
      <a-entity position="0.29 0.061 0.20"
        animation="property: rotation; from: 0 0 10; to: 0 0 -12; dir: alternate; dur: 2100; loop: true; easing: easeInOutSine">
        <a-cylinder position="0 0.105 0" radius="0.019" height="0.21"
          rotation="0 0 8" color="#48B980"></a-cylinder>
        <a-cylinder position="-0.048 0.075 0" radius="0.014" height="0.15"
          rotation="0 0 -32" color="#228C6E"></a-cylinder>
      </a-entity>

      <!-- サンゴ：短い円柱を組み合わせる -->
      <a-entity position="0.31 0.064 -0.14">
        <a-cylinder position="0 0.075 0" radius="0.022" height="0.15" color="#FF7990"></a-cylinder>
        <a-cylinder position="-0.041 0.105 0" radius="0.018" height="0.12"
          rotation="0 0 -38" color="#FF92A3"></a-cylinder>
        <a-cylinder position="0.045 0.090 0.018" radius="0.018" height="0.11"
          rotation="28 0 34" color="#FF7990"></a-cylinder>
      </a-entity>
      <a-entity position="-0.09 0.063 0.32">
        <a-sphere position="0 0.055 0" scale="0.06 0.055 0.05" color="#B998DF"></a-sphere>
        <a-sphere position="0.047 0.050 0.007" scale="0.042 0.04 0.038" color="#D1B6F2"></a-sphere>
      </a-entity>

      <!-- 魚1：オレンジ色。外側の回転で円を描いて泳ぐ -->
      <a-entity animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 9000; loop: true; easing: linear">
        <a-entity position="0.32 0.37 0" rotation="0 90 0"
          animation="property: position; from: 0.32 0.34 0; to: 0.32 0.40 0; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
          <a-sphere scale="0.12 0.075 0.059" color="#FF9845"></a-sphere>
          <a-cone position="-0.16 0 0" radius-bottom="0.08" radius-top="0"
            height="0.15" rotation="0 0 -90" color="#FF713D"
            animation="property: rotation; from: 0 0 -80; to: 0 0 -100; dir: alternate; dur: 420; loop: true"></a-cone>
          <a-cone position="-0.025 0.076 0" radius-bottom="0.04" radius-top="0"
            height="0.09" rotation="0 0 -5" color="#FFBC60"></a-cone>
          <a-sphere position="0.070 0.025 0.054" radius="0.012" color="#1D3343"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- 魚2：青色。反対方向に、少しゆっくり回遊 -->
      <a-entity animation="property: rotation; from: 0 145 0; to: 0 -215 0; dur: 11500; loop: true; easing: linear">
        <a-entity position="0.24 0.28 0" rotation="0 -90 0"
          animation="property: position; from: 0.24 0.27 0; to: 0.24 0.32 0; dir: alternate; dur: 2200; loop: true; easing: easeInOutSine">
          <a-sphere scale="0.103 0.066 0.050" color="#49B8EE"></a-sphere>
          <a-cone position="-0.14 0 0" radius-bottom="0.065" radius-top="0"
            height="0.13" rotation="0 0 -90" color="#228AD4"
            animation="property: rotation; from: 0 0 -80; to: 0 0 -100; dir: alternate; dur: 490; loop: true"></a-cone>
          <a-cone position="-0.01 0.070 0" radius-bottom="0.035" radius-top="0"
            height="0.075" color="#9AE0F9"></a-cone>
          <a-sphere position="0.060 0.023 0.045" radius="0.010" color="#173A57"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- 魚3：黄色。内側の小さな円を泳ぐ -->
      <a-entity animation="property: rotation; from: 0 250 0; to: 0 610 0; dur: 7500; loop: true; easing: linear">
        <a-entity position="0.15 0.46 0" rotation="0 90 0"
          animation="property: position; from: 0.15 0.43 0; to: 0.15 0.49 0; dir: alternate; dur: 1400; loop: true; easing: easeInOutSine">
          <a-sphere scale="0.092 0.058 0.048" color="#FFD35D"></a-sphere>
          <a-cone position="-0.12 0 0" radius-bottom="0.06" radius-top="0"
            height="0.12" rotation="0 0 -90" color="#FFA950"
            animation="property: rotation; from: 0 0 -80; to: 0 0 -100; dir: alternate; dur: 380; loop: true"></a-cone>
          <a-cone position="-0.012 0.059 0" radius-bottom="0.029" radius-top="0"
            height="0.065" color="#FFE89A"></a-cone>
          <a-sphere position="0.052 0.017 0.043" radius="0.010" color="#3E3B31"></a-sphere>
        </a-entity>
      </a-entity>

      <!-- 泡：海底から上へ繰り返し浮かぶ -->
      <a-sphere position="-0.05 0.12 -0.20" radius="0.018"
        material="color: #D6F8FF; opacity: 0.72; transparent: true"
        animation="property: position; from: -0.05 0.12 -0.20; to: -0.05 0.62 -0.20; dur: 2600; loop: true; easing: linear"></a-sphere>
      <a-sphere position="0.08 0.25 -0.19" radius="0.012"
        material="color: #D6F8FF; opacity: 0.60; transparent: true"
        animation="property: position; from: 0.08 0.13 -0.19; to: 0.08 0.60 -0.19; dur: 3300; loop: true; easing: linear"></a-sphere>
      <a-sphere position="0.16 0.20 0.16" radius="0.014"
        material="color: #D6F8FF; opacity: 0.65; transparent: true"
        animation="property: position; from: 0.16 0.12 0.16; to: 0.16 0.58 0.16; dur: 2900; loop: true; easing: linear"></a-sphere>

    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
