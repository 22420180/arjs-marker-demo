
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ARミニ太陽系</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false">

    <a-marker type="pattern" url="pattern-dosei.patt">

      <!-- 台座 -->
      <a-cylinder position="0 0.035 0"
        radius="0.97" height="0.07"
        color="#101C32">
      </a-cylinder>

      <!-- 照明 -->
      <a-light type="ambient"
        color="#FFFFFF" intensity="0.8">
      </a-light>
      <a-light type="point"
        position="0 0.7 0"
        color="#FFFFFF" intensity="1.2">
      </a-light>

      <!-- 公転軌道 -->
      <a-torus position="0 0.4 0" rotation="90 0 0"
        radius="0.20" radius-tubular="0.002"
        color="#6F8DA7"></a-torus>
      <a-torus position="0 0.4 0" rotation="90 0 0"
        radius="0.30" radius-tubular="0.002"
        color="#6F8DA7"></a-torus>
      <a-torus position="0 0.4 0" rotation="90 0 0"
        radius="0.40" radius-tubular="0.002"
        color="#6F8DA7"></a-torus>
      <a-torus position="0 0.4 0" rotation="90 0 0"
        radius="0.50" radius-tubular="0.002"
        color="#6F8DA7"></a-torus>
      <a-torus position="0 0.4 0" rotation="90 0 0"
        radius="0.64" radius-tubular="0.002"
        color="#6F8DA7"></a-torus>
      <a-torus position="0 0.4 0" rotation="90 0 0"
        radius="0.77" radius-tubular="0.002"
        color="#6F8DA7"></a-torus>

      <!-- 太陽 -->
      <a-sphere position="0 0.4 0" radius="0.128"
        material="src: url(sun.jpg); emissive: #FF7D23; emissiveIntensity: 0.4"
        animation="property: rotation; to: 0 360 0; dur: 30000; easing: linear; loop: true">
      </a-sphere>

      <!-- 水星 -->
      <a-entity position="0 0.4 0"
        animation="property: rotation; to: 0 360 0; dur: 7000; easing: linear; loop: true">
        <a-sphere position="0.20 0 0"
          radius="0.024"
          material="src: url(mercury.jpg)"
          animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true">
        </a-sphere>
      </a-entity>

      <!-- 金星 -->
      <a-entity position="0 0.4 0"
        animation="property: rotation; to: 0 360 0; dur: 10500; easing: linear; loop: true">
        <a-sphere position="0.30 0 0"
          radius="0.037"
          material="src: url(venus.jpg)"
          animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true">
        </a-sphere>
      </a-entity>

      <!-- 地球 -->
      <a-entity position="0 0.4 0"
        animation="property: rotation; to: 0 360 0; dur: 14500; easing: linear; loop: true">
        <a-sphere position="0.40 0 0"
          radius="0.047"
          material="src: url(earth.jpg)"
          animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true">
        </a-sphere>
      </a-entity>

      <!-- 火星 -->
      <a-entity position="0 0.4 0"
        animation="property: rotation; to: 0 360 0; dur: 18800; easing: linear; loop: true">
        <a-sphere position="0.50 0 0"
          radius="0.035"
          material="src: url(mars.jpg)"
          animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true">
        </a-sphere>
      </a-entity>

      <!-- 木星 -->
      <a-entity position="0 0.4 0"
        animation="property: rotation; to: 0 360 0; dur: 26500; easing: linear; loop: true">
        <a-sphere position="0.64 0 0"
          radius="0.077"
          material="src: url(jupiter.jpg)"
          animation="property: rotation; to: 0 360 0; dur: 4000; easing: linear; loop: true">
        </a-sphere>
      </a-entity>

      <!-- 土星 -->
      <a-entity position="0 0.4 0"
        animation="property: rotation; to: 0 360 0; dur: 35000; easing: linear; loop: true">
        <a-entity position="0.77 0 0">
          <a-sphere radius="0.066"
            material="src: url(saturn.jpg)"
            animation="property: rotation; to: 0 360 0; dur: 6000; easing: linear; loop: true">
          </a-sphere>
          <a-ring rotation="-68 0 15"
            radius-inner="0.082"
            radius-outer="0.12"
            material="color: #D7C6A1; side: double">
          </a-ring>
        </a-entity>
      </a-entity>

    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
